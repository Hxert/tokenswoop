# Initial HTTP configuration used to obtain the shared TLS certificate.
server {
    listen 80;
    listen [::]:80;
    server_name tokenswoop.xyz app.tokenswoop.xyz testnet.tokenswoop.xyz;

    location /.well-known/acme-challenge/ {
        root /var/www/tokenswoop-acme;
        try_files $uri =404;
    }

    location / { return 503; }
}
