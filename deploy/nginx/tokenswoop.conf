map $host $tokenswoop_api {
    default "";
    app.tokenswoop.xyz 127.0.0.1:8080;
    testnet.tokenswoop.xyz 127.0.0.1:8081;
}

server {
    listen 80;
    listen [::]:80;
    server_name tokenswoop.xyz app.tokenswoop.xyz testnet.tokenswoop.xyz;

    location /.well-known/acme-challenge/ {
        root /var/www/tokenswoop-acme;
        try_files $uri =404;
    }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name tokenswoop.xyz app.tokenswoop.xyz testnet.tokenswoop.xyz;

    ssl_certificate /etc/letsencrypt/live/tokenswoop.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tokenswoop.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:tokenswoop_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /opt/tokenswoop/current/web;
    index index.html;
    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; connect-src 'self' https://challenges.cloudflare.com https://auth.privy.io https://*.rpc.privy.systems wss://relay.walletconnect.com wss://relay.walletconnect.org wss://www.walletlink.org https://explorer-api.walletconnect.com; child-src https://auth.privy.io https://verify.walletconnect.com https://verify.walletconnect.org; frame-src https://auth.privy.io https://verify.walletconnect.com https://verify.walletconnect.org https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; object-src 'none'; worker-src 'self'; manifest-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    # Query strings can contain API credentials. The access log records $uri only.
    access_log /var/log/nginx/tokenswoop-access.log tokenswoop;
    error_log /var/log/nginx/tokenswoop-error.log warn;

    location ~ ^/(api|v1|v1beta|health)(/|$) {
        if ($tokenswoop_api = "") { return 404; }
        proxy_pass http://$tokenswoop_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3700s;
        proxy_send_timeout 135s;
    }

    location ^~ /source/ {
        return 404;
    }

    location ~ /\.(?!well-known/) { return 404; }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        access_log off;
    }

    location = /index.html {
        expires -1;
    }

    location / { try_files $uri $uri/ /index.html; }
}
