[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc = ".toolchain/bin/solc-0.8.37"
evm_version = "cancun"
network = "monad"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
cbor_metadata = false
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/"
]
fs_permissions = [
    { access = "read-write", path = "./deployments" },
    { access = "read-write", path = "./reports" }
]

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 256
depth = 64
fail_on_revert = true

# Local adversarial and sequence testing of the currently deployed ReserveDebt.
[profile.reserve-security.fuzz]
runs = 2048

[profile.reserve-security.invariant]
runs = 512
depth = 128
fail_on_revert = true

[rpc_endpoints]
monad_testnet = "${MONAD_TESTNET_RPC_URL}"
monad_mainnet = "${MONAD_MAINNET_RPC_URL}"
